name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Check the database schema loads
        run: |
          npx wrangler d1 execute golden-shotokan --local --file=db/schema.sql
          npx wrangler d1 execute golden-shotokan --local --file=db/schema.sql
